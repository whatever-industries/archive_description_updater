name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  VERSION: "1.0.0"
  APP: "Archive.org Redump Link Updater"
  BIN: "archive-org-redump-link-updater"

jobs:
  build-macos:
    name: macOS App (ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-apple-darwin)
        run: |
          rustup update stable
          rustup target add aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create .app bundle
        run: |
          APP="dist/${{ env.APP }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/aarch64-apple-darwin/release/${{ env.BIN }}" "$APP/Contents/MacOS/${{ env.APP }}"
          chmod +x "$APP/Contents/MacOS/${{ env.APP }}"
          cp icons/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>${{ env.APP }}</string>
            <key>CFBundleDisplayName</key><string>${{ env.APP }}</string>
            <key>CFBundleIdentifier</key><string>com.whateverindustries.redumplinkupdater</string>
            <key>CFBundleVersion</key><string>${{ env.VERSION }}</string>
            <key>CFBundleShortVersionString</key><string>${{ env.VERSION }}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleExecutable</key><string>${{ env.APP }}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - "dist/${{ env.APP }}.app"

      - name: Zip .app
        run: |
          cd dist
          zip -r "${{ env.APP }}_macOS_v${{ env.VERSION }}.zip" "${{ env.APP }}.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedumpLinkUpdater-macOS
          path: "dist/${{ env.APP }}_macOS_v${{ env.VERSION }}.zip"
          retention-days: 1

  build-windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup update stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Rename EXE
        shell: pwsh
        run: |
          Copy-Item "target/release/${{ env.BIN }}.exe" "${{ env.APP }}_Windows_v${{ env.VERSION }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedumpLinkUpdater-Windows
          path: "${{ env.APP }}_Windows_v${{ env.VERSION }}.exe"
          retention-days: 1

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libfuse2 pkg-config

      - name: Install Rust
        run: rustup update stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Build AppImage
        run: |
          set -e
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp "target/release/${{ env.BIN }}" "AppDir/usr/bin/${{ env.BIN }}"
          cp icons/AppIcon_256.png "AppDir/usr/share/icons/hicolor/256x256/apps/${{ env.BIN }}.png"
          cp icons/AppIcon_256.png "AppDir/${{ env.BIN }}.png"

          cat > "AppDir/usr/share/applications/${{ env.BIN }}.desktop" <<EOF
          [Desktop Entry]
          Name=${{ env.APP }}
          Comment=Rewrite redump.org links to redump.info in your archive.org descriptions
          Exec=${{ env.BIN }}
          Icon=${{ env.BIN }}
          Type=Application
          Categories=Utility;
          StartupWMClass=${{ env.BIN }}
          EOF
          cp "AppDir/usr/share/applications/${{ env.BIN }}.desktop" "AppDir/${{ env.BIN }}.desktop"

          cat > AppDir/AppRun <<EOF
          #!/bin/bash
          SELF=\$(readlink -f "\$0")
          HERE=\$(dirname "\$SELF")
          exec "\$HERE/usr/bin/${{ env.BIN }}" "\$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "${{ env.APP }}_Linux_v${{ env.VERSION }}.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedumpLinkUpdater-Linux
          path: "${{ env.APP }}_Linux_v${{ env.VERSION }}.AppImage"
          retention-days: 1

  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.APP }} v${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ${{ env.APP }} v${{ env.VERSION }}

            Rewrites `redump.org` to `redump.info` in the descriptions of your own
            archive.org uploads. Sign in, scan, review the changes, apply.

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (ARM64) | `${{ env.APP }}_macOS_v${{ env.VERSION }}.zip` |
            | Windows | `${{ env.APP }}_Windows_v${{ env.VERSION }}.exe` |
            | Linux | `${{ env.APP }}_Linux_v${{ env.VERSION }}.AppImage` |

            ### What it changes
            - Plain text, and links: `www.redump.org/disc/123` becomes `www.redump.info/disc/123`
            - Casing is preserved; lookalikes such as `notredump.org` are left alone
            - Only the description field is touched - titles and files are untouched
          files: |
            artifacts/RedumpLinkUpdater-macOS/${{ env.APP }}_macOS_v${{ env.VERSION }}.zip
            artifacts/RedumpLinkUpdater-Windows/${{ env.APP }}_Windows_v${{ env.VERSION }}.exe
            artifacts/RedumpLinkUpdater-Linux/${{ env.APP }}_Linux_v${{ env.VERSION }}.AppImage
